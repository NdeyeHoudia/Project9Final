<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
	<meta charset="utf-8" />
	<title>Application Pay My Buddy</title>

	<link rel="stylesheet"
		  href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
		  integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
		  crossorigin="anonymous">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">

	<div class="row">

		<form action="#" th:action="@{/patient/history/{id}(id=${patient.id})}" th:object="${patient}" method="post" class="form-horizontal" style="width: 100%">
			<h2>History Patient</h2>
			<div th:object="${patient}">
				<h3 class="text-center">
					<span id="lastname" th:text="*{lastname}"></span>
					<span id="date_of_birth" th:text="*{date_of_birth}"></span>
				</h3>
			</div>
			<table class = "table table-striped table-bordered">
				<thead class = "table-dark" style="background-color: #708090;">
				<tr style="color:#FFFFFF">
					<th> Note</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each = "n:${noteDTOS}">
					<td th:text = "${n.note}"></td>
				</tr>
				</tbody>
			</table>
		</form>
		<div>
			<h3 class="text-center"><span style="width: 35%; background-color: #8FBC8F;" class="text-center" th:text="${status}"></span></h3>
		</div>

		<div class="form-group">
			<div class="col-sm-12">
				<a class="btn btn-danger btn-sm" href="/patient/list">Cancel</a>
				<a class="btn btn-primary btn-sm" th:href="@{/note/add/{id}(id=${patient.id})}">Add Note</a>&nbsp;
				<a class="btn btn-primary btn-sm" href="/note/note">List Note</a>
			</div>
		</div>
	</div>

</div>
</body>
</html>


<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
	<meta charset="utf-8" />
	<title>Application Pay My Buddy</title>

	<link rel="stylesheet"
		  href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
		  integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
		  crossorigin="anonymous">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class ="container">
		<div class = "row">
			<h3> My Notes </h3>
		</div>
		<table class = "table table-striped table-bordered">
			<thead class = "table-dark" style="background-color: #708090;">
			<tr style="color:#FFFFFF">
				<th> patientId</th>
				<th> Patient</th>
				<th> Note</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each = "n:${notes}">
				<td th:text = "${n.idPatient}"></td>
				<td th:text = "${n.patient}"></td>
				<td th:text = "${n.note}"></td>
			</tr>
			</tbody>
		</table>
	<a class="btn btn-danger btn-sm" href="/patient/list">Cancel</a>

</div>
</body>
</html>
